name: notes-recovery

# Phase 5 Gate 0 (docs/roadmap.md): cloud sessions cannot push refs/notes/signoff
# through the session git proxy (403), so this workflow reconstructs the ref
# from the [SIGNOFF *] attestation commits in main's history and in the heads
# of merged, same-repository pull requests (the attestation of a squash- or
# rebase-merged branch lives only there) — plus the pre-extraction
# production-attestation fixture — and pushes it from Actions, where pushes
# are unrestricted. Idempotent: an up-to-date ref produces no new commit.
# Uses this repository's own composite action, the one adopters scaffold.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: ./recover
        with:
          branch: main
          payload-file: scripts/tests/fixtures/production_attestation.txt
