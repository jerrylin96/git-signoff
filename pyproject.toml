[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-signoff"
version = "0.4.0"
description = "Git Signoff Attestation (GSA) Protocol v1.0 — deterministic MCP server mechanics for human comprehension attestations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp"]

[project.urls]
Homepage = "https://github.com/jerrylin96/signoff"
Repository = "https://github.com/jerrylin96/signoff"

[project.scripts]
# Primary command. git dispatches `git signoff` to it, so bare invocation prints
# help; `git-signoff serve` runs the MCP server, `git-signoff init` the initializer.
git-signoff = "signoff_mcp.server:cli_main"
# Compatibility alias: bare `signoff-mcp` still runs the server.
signoff-mcp = "signoff_mcp.server:main"

[tool.setuptools.packages.find]
include = ["signoff_mcp*"]
exclude = ["signoff_mcp.tests*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]
