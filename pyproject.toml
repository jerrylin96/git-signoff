# No Python package is built or installed from this repository. The adoption
# path is the curl-run init.py plus the vendored skill folder
# (skills/git-signoff/: SKILL.md, attest.py, verify_signoff.py), all standard
# library. [project] exists only so release.yml can read the version; the
# "Private" classifier makes PyPI refuse an upload should anyone try.
[project]
name = "git-signoff"
version = "0.5.0"
description = "Git Signoff Attestation (GSA) Protocol v1.0 — Socratic human-comprehension attestations in git (not distributed on PyPI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[project.urls]
Homepage = "https://github.com/jerrylin96/git-signoff"
Repository = "https://github.com/jerrylin96/git-signoff"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]
