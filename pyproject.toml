[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# git_signoff/ is the Python reference implementation of the GSA producer
# mechanics (gsa-core §2.3–§2.5, §3): an executable specification exercised by
# the test suite, not a distribution. Nothing here is installed by users — the
# adoption path is the curl-run init.py and the vendored skill folder, both
# standard-library only. The "Private" classifier makes PyPI refuse an upload.
[project]
name = "git-signoff"
version = "0.4.0"
description = "Git Signoff Attestation (GSA) Protocol v1.0 — Python reference implementation of the producer mechanics (tests only; not distributed)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[project.urls]
Homepage = "https://github.com/jerrylin96/git-signoff"
Repository = "https://github.com/jerrylin96/git-signoff"

[tool.setuptools.packages.find]
include = ["git_signoff*"]
exclude = ["git_signoff.tests*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]
